# Builds, signs, notarizes, and packages Weblogin SSO for distribution, then
# attaches the .pkg (with its sha256) to a GitHub Release. Fleet pulls the pkg
# from the release URL via fleet-config GitOps.
#
# Trigger: push a tag like v1.5.2-sunstone.1 (tag = deliberate release decision;
# upstream churn never reaches the fleet on its own).
#
# Required secrets, scoped to the "release" GitHub Actions environment (NOT
# repository secrets — those would be visible to every PR build). The
# environment's deployment branch policy further restricts it to tag refs
# matching v* — a workflow_dispatch off main, or any non-tag ref, cannot see
# these secrets even though workflow_dispatch is still a valid trigger. See
# docs/RELEASING.md for how to mint these:
#   DEVID_CERTS_P12          base64 .p12 containing BOTH Developer ID
#                            Application and Developer ID Installer certs+keys
#   DEVID_CERTS_PASSWORD     password of that .p12
#   APP_PROVISIONING_PROFILE_B64   base64 .provisionprofile for the app
#   SSOE_PROVISIONING_PROFILE_B64  base64 .provisionprofile for the extension
#   NOTARY_ISSUER_ID         App Store Connect API key issuer ID
#   NOTARY_KEY_ID            App Store Connect API key ID
#   NOTARY_KEY               contents of the .p8 API key
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    environment: release
    # A healthy run takes ~10 minutes; anything longer means something is
    # waiting on a dialog or Apple, so fail fast instead of soaking a runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Import Developer ID certificates into a temporary keychain
        env:
          P12_B64: ${{ secrets.DEVID_CERTS_P12 }}
          P12_PASSWORD: ${{ secrets.DEVID_CERTS_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_B64" | base64 -d > $RUNNER_TEMP/certs.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Every binary that will use the private keys must be trusted here,
          # or macOS tries to show a keychain access dialog and the headless
          # runner hangs forever. productbuild signs the pkg, so it needs to
          # be listed alongside codesign/productsign.
          security import $RUNNER_TEMP/certs.p12 -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm $RUNNER_TEMP/certs.p12
          security find-identity -v "$KEYCHAIN"

      - name: Install provisioning profiles
        env:
          APP_PROFILE_B64: ${{ secrets.APP_PROVISIONING_PROFILE_B64 }}
          SSOE_PROFILE_B64: ${{ secrets.SSOE_PROVISIONING_PROFILE_B64 }}
        run: |
          set -euo pipefail
          # Xcode 16+ reads from UserData; older tooling from MobileDevice.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "$APP_PROFILE_B64"  | base64 -d > "$dir/app.provisionprofile"
            echo "$SSOE_PROFILE_B64" | base64 -d > "$dir/ssoe.provisionprofile"
          done

      - name: Archive
        run: |
          xcodebuild -project "Weblogin SSO.xcodeproj" -scheme "Weblogin SSO" \
            -configuration Release archive \
            -archivePath build/WebloginSSO.xcarchive

      - name: Export (Developer ID)
        run: |
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>ai.sunstoneinstitute.psso-extension</key>
              <string>Sunstone PSSO App (Developer ID)</string>
              <key>ai.sunstoneinstitute.psso-extension.ssoe</key>
              <string>Sunstone PSSO Extension (Developer ID)</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/WebloginSSO.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export

      - name: Notarize and staple the app
        env:
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY" > $RUNNER_TEMP/notary.p8
          APP="build/export/Weblogin SSO.app"
          ditto -c -k --keepParent "$APP" build/app.zip
          xcrun notarytool submit build/app.zip --wait --timeout 10m \
            --issuer "$NOTARY_ISSUER_ID" --key-id "$NOTARY_KEY_ID" \
            --key $RUNNER_TEMP/notary.p8
          xcrun stapler staple "$APP"

      - name: Build, sign, notarize, and staple the pkg
        env:
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="build/WebloginSSO-$VERSION.pkg"
          productbuild \
            --component "build/export/Weblogin SSO.app" /Applications \
            --version "$VERSION" \
            --sign "Developer ID Installer" \
            "$PKG"
          xcrun notarytool submit "$PKG" --wait --timeout 10m \
            --issuer "$NOTARY_ISSUER_ID" --key-id "$NOTARY_KEY_ID" \
            --key $RUNNER_TEMP/notary.p8
          xcrun stapler staple "$PKG"
          shasum -a 256 "$PKG" | tee build/SHA256SUMS

      - name: Verify Gatekeeper acceptance
        run: |
          spctl --assess -vv --type install build/WebloginSSO-*.pkg
          codesign --verify --deep --strict -v "build/export/Weblogin SSO.app"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/WebloginSSO-*.pkg build/SHA256SUMS \
            --title "Weblogin SSO $GITHUB_REF_NAME" \
            --notes "$(printf 'Signed + notarized Developer ID build for Sunstone fleet deployment.\n\n```\n%s\n```' "$(cat build/SHA256SUMS)")"
