# Validates the xcconfig deployment plumbing on a runner with full Xcode
# (local machines with only Command Line Tools can't run xcodebuild).
#
# Signing is forced to ad-hoc (identity "-") so no certificates or provisioning
# profiles are needed, while entitlements are still processed — which is where
# $(SSO_HOST) / $(APP_GROUP_ID) expansion happens. The job asserts the signed
# products carry the resolved Sunstone values from Config/Local.xcconfig.
name: validate-build

on:
  push:
    branches: [sunstone]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The project targets macOS 26 and uses macOS 26 AuthenticationServices
    # APIs, so the runner needs Xcode 26 (macos-15 images top out at Xcode 16).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Run unit tests (ssoeTests)
        run: |
          xcodebuild -project "Weblogin SSO.xcodeproj" -scheme "ssoeTests" \
            -destination "platform=macOS" test \
            SIGNING_STYLE=Manual SIGNING_IDENTITY=- SIGNING_TEAM= \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Show resolved deployment settings
        run: |
          xcodebuild -project "Weblogin SSO.xcodeproj" -scheme "Weblogin SSO" \
            -configuration Release -showBuildSettings 2>/dev/null \
            | grep -E '(APP_BUNDLE_ID|SSOE_BUNDLE_ID|SSO_HOST|APP_GROUP_ID|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|DEVELOPMENT_TEAM) =' \
            | sort -u

      - name: Build (ad-hoc signed)
        run: |
          xcodebuild -project "Weblogin SSO.xcodeproj" -scheme "Weblogin SSO" \
            -configuration Release -derivedDataPath build build \
            SIGNING_STYLE=Manual SIGNING_IDENTITY=- SIGNING_TEAM= \
            APP_PROVISIONING_PROFILE= SSOE_PROVISIONING_PROFILE= \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Assert resolved entitlements and Info.plist values
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Weblogin SSO.app"
          APPEX="$APP/Contents/PlugIns/ssoe.appex"

          for bundle in "$APP" "$APPEX"; do
            echo "=== Entitlements: $bundle"
            codesign -d --entitlements :- "$bundle" | tee /tmp/ent.plist
            # No unexpanded build-setting variables may survive signing.
            ! grep -F '$(' /tmp/ent.plist
            grep -q 'authsrv:auth.sunstoneinstitute.ai' /tmp/ent.plist
            grep -q 'group.ai.sunstoneinstitute.psso' /tmp/ent.plist
          done

          echo "=== Bundle identity"
          plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist" \
            | grep -x 'ai.sunstoneinstitute.psso-extension'
          plutil -extract CFBundleIdentifier raw "$APPEX/Contents/Info.plist" \
            | grep -x 'ai.sunstoneinstitute.psso-extension.ssoe'

          echo "=== Runtime config surfaced via Info.plist"
          plutil -extract AppGroupID raw "$APP/Contents/Info.plist" \
            | grep -x 'group.ai.sunstoneinstitute.psso'
          plutil -extract AppGroupID raw "$APPEX/Contents/Info.plist" \
            | grep -x 'group.ai.sunstoneinstitute.psso'
          plutil -extract LogSubsystem raw "$APPEX/Contents/Info.plist" \
            | grep -x 'ai.sunstoneinstitute.psso-extension'
